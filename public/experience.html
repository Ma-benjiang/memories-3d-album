<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Memories · 3D 相册</title>
    <!--
  Interactive 3D book showcase. Single file, no build step.

  Notes for editing:
  - Book data + procedural cover painters live in the BOOKS array below.
  - Each book has coverURL:null. Drop a direct image URL there and the code
    attempts a CORS texture load, falling back to the painted cover if the
    host does not send Access-Control-Allow-Origin (Amazon image CDNs do not).
  - All geometry, textures, lighting and the environment map are procedural.
-->
    <style>
      :root {
        --navy: #201914;
        --pink: #c6a56b;
        --cream: #f4ecdc;
        --lav: #ddd0b9;
        --peri: #a88759;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(
          120% 100% at 50% 0%,
          #40342b 0%,
          #241d18 55%,
          #15110e 100%
        );
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
      }
      body.day{background:radial-gradient(120% 100% at 50% 0%,#6e5a48 0%,#342920 58%,#18120f 100%)}
      body.night{background:radial-gradient(120% 100% at 50% 0%,#292b38 0%,#171820 58%,#0b0c11 100%)}
      button {
        font-family: inherit;
        cursor: pointer;
        border: 0;
      }
      button:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }

      /* ---------- hero word ---------- */
      .hero-word {
        position: fixed;
        top: 18vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
        user-select: none;
        pointer-events: none;
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }
      .hero-word span {
        display: block;
        white-space: nowrap;
        font-size: min(14.5vw, 28vh);
        font-weight: 800;
        letter-spacing: -0.015em;
        line-height: 0.85;
        color: var(--pink);
        animation: heroIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }
      @keyframes heroIn {
        from {
          opacity: 0;
          transform: translateY(60px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      body.detail-open .hero-word,
      body.transit .hero-word {
        opacity: 0;
        transform: translateX(-50%) translateY(-44px);
      }
      body.table-mode .hero-word{opacity:.12;transform:translateX(-50%) translateY(-28px)}
      body.table-mode #timeline{opacity:0;pointer-events:none}
      #timeline{position:fixed;left:50%;bottom:24px;z-index:35;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:rgba(28,21,16,.72);backdrop-filter:blur(12px);border:1px solid rgba(210,177,119,.25);border-radius:999px}
      #timeline button{padding:8px 15px;border-radius:999px;background:transparent;color:#d9c6a6;font-size:13px}
      #timeline button:hover{background:#eee4d2;color:#2a211b}
      body.detail-open #timeline,body.transit #timeline{opacity:0;pointer-events:none}
      .paw-print{position:fixed;z-index:60;font-size:28px;pointer-events:none;animation:pawWalk 1.8s ease-out forwards}
      @keyframes pawWalk{0%{opacity:0;transform:translateY(25px) rotate(-20deg) scale(.5)}20%{opacity:.8}100%{opacity:0;transform:translateY(-90px) rotate(18deg) scale(1.1)}}
      #toast{position:fixed;left:50%;top:88px;z-index:90;transform:translate(-50%,-12px);padding:10px 18px;border-radius:999px;background:#f1e7d4;color:#30241b;box-shadow:0 12px 35px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.28s ease}
      #toast.on{opacity:1;transform:translate(-50%,0)}

      /* ---------- canvas ---------- */
      #gl {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: block;
        touch-action: none;
      }

      /* ---------- nav ---------- */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 26px 42px;
        pointer-events: none;
      }
      nav > * {
        pointer-events: auto;
      }
      .logo {
        color: var(--pink);
        font-weight: 800;
        font-size: clamp(20px, 2.2vw, 29px);
        letter-spacing: -0.01em;
      }
      .nav-r {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }
      .menu-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--cream);
        color: var(--navy);
        font-size: 20px;
        font-weight: 800;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cta {
        height: 48px;
        padding: 0 26px;
        border-radius: 999px;
        background: var(--cream);
        color: var(--navy);
        font-weight: 600;
        font-size: 16px;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .menu-btn:hover,
      .cta:hover {
        transform: scale(1.05);
      }

      /* ---------- open slip: a torn scrap of page that trails the cursor ----------
         clip-path gives every edge a deckled tear; drop-shadow (not box-shadow)
         is used so the shadow follows the torn silhouette instead of a rectangle.
         Never interactive: the click is handled by the book underneath. */
      #openBtn {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 30;
        padding: 16px 38px 18px;
        border: 0;
        border-radius: 0;
        background:
          repeating-linear-gradient(
            92deg,
            rgba(90, 74, 40, 0.03) 0 2px,
            transparent 2px 6px
          ),
          radial-gradient(
            125% 150% at 28% 0%,
            #fffdf7 0%,
            #f8f2e3 58%,
            #ede4cf 100%
          );
        color: var(--navy);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        clip-path: polygon(
          0% 0.9%,
          8.3% 0.8%,
          16.7% 6.3%,
          25% 3.8%,
          33.3% 5.5%,
          41.7% 2.7%,
          50% 5.2%,
          58.3% 0.4%,
          66.7% 5.9%,
          75% 6.5%,
          83.3% 1%,
          91.7% 6.4%,
          100% 0.7%,
          97.7% 20%,
          97% 40%,
          99.6% 60%,
          98.7% 80%,
          100% 96.5%,
          91.7% 99.8%,
          83.3% 95.6%,
          75% 94.9%,
          66.7% 96.6%,
          58.3% 93.5%,
          50% 97.9%,
          41.7% 99.5%,
          33.3% 93.2%,
          25% 93.6%,
          16.7% 93.2%,
          8.3% 93.1%,
          0% 93.5%,
          0.2% 80%,
          1.1% 60%,
          3.9% 40%,
          3.8% 20%
        );
        filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.16))
          drop-shadow(0 14px 26px rgba(0, 0, 0, 0.4));
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) rotate(-1.6deg) scale(0.94);
        transition:
          opacity 0.24s ease,
          transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform, opacity, left, top;
      }
      #openBtn.on {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-1.6deg) scale(1);
      }

      /* ---------- close button ---------- */
      #closeBtn {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: transparent;
        color: var(--cream);
        border: 1.5px solid rgba(253, 251, 244, 0.4);
        font-size: 17px;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.4s ease 0.15s,
          border-color 0.25s ease;
      }
      #closeBtn:hover {
        border-color: rgba(253, 251, 244, 0.9);
      }
      body.detail-open #closeBtn {
        opacity: 1;
        pointer-events: auto;
      }

      /* ---------- detail panel ---------- */
      .dp {
        position: fixed;
        right: 7vw;
        top: 50%;
        transform: translateY(-50%);
        width: min(560px, 42vw);
        z-index: 15;
        pointer-events: none;
        visibility: hidden;
        transition: visibility 0s 0.5s;
      }
      body.detail-open .dp {
        visibility: visible;
        transition: visibility 0s 0s;
      }
      .dp > * {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
      }
      body.detail-open .dp > * {
        opacity: 1;
        transform: none;
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.detail-open .dp > *:nth-child(1) {
        transition-delay: 0.05s;
      }
      body.detail-open .dp > *:nth-child(2) {
        transition-delay: 0.13s;
      }
      body.detail-open .dp > *:nth-child(3) {
        transition-delay: 0.21s;
      }
      body.detail-open .dp > *:nth-child(4) {
        transition-delay: 0.27s;
      }
      body.detail-open .dp > *:nth-child(5) {
        transition-delay: 0.33s;
      }

      .dp h1 {
        margin: 0;
        color: var(--pink);
        font-size: clamp(52px, 5.6vw, 92px);
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.015em;
      }
      .dp p {
        margin: 26px 0 0;
        color: var(--lav);
        font-size: clamp(16px, 1.25vw, 19px);
        line-height: 1.65;
        font-weight: 400;
        max-width: 54ch;
      }
      .meta {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .stars {
        display: flex;
        gap: 5px;
      }
      .stars svg {
        width: 25px;
        height: 25px;
        fill: var(--pink);
      }
      .stars svg.dim {
        opacity: 0.25;
      }
      .sep {
        width: 1px;
        height: 24px;
        background: rgba(200, 208, 240, 0.28);
      }
      .src,
      .year {
        color: #98a4d6;
        font-style: italic;
        font-size: 19px;
      }
      .year {
        margin-left: auto;
      }
      .rule {
        margin-top: 26px;
        border-top: 1px solid rgba(200, 208, 240, 0.18);
      }
      .actions {
        margin-top: 32px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #1a2140;
        border-radius: 999px;
        padding: 10px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        pointer-events: auto;
      }
      .pill {
        height: 54px;
        padding: 0 26px;
        border-radius: 999px;
        font-size: 16.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition:
          transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
          filter 0.2s;
      }
      .pill:hover {
        transform: scale(1.04);
        filter: brightness(1.05);
      }
      .pill.lang {
        background: var(--cream);
        color: var(--navy);
      }
      .pill.buy {
        background: var(--peri);
        color: #10152c;
      }
      .pill.iconb {
        width: 54px;
        padding: 0;
        justify-content: center;
        background: #242c50;
        color: var(--lav);
      }
      .pill svg {
        width: 20px;
        height: 20px;
      }

      /* ---------- portrait / small screens ---------- */
      @media (max-aspect-ratio: 17/20), (max-width: 760px) {
        nav {
          padding: 18px 20px;
        }
        .hero-word {
          top: 7vh;
        }
        .hero-word span {
          font-size: 34vw;
        }
        .dp {
          right: auto;
          left: 50%;
          top: auto;
          bottom: 3.5vh;
          transform: translateX(-50%);
          width: min(560px, 92vw);
        }
        .dp h1 {
          font-size: clamp(36px, 9.5vw, 54px);
        }
        .dp p {
          font-size: 15px;
          margin-top: 16px;
          display: -webkit-box;
          -webkit-line-clamp: 4;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .meta {
          margin-top: 18px;
        }
        .rule {
          margin-top: 16px;
        }
        .actions {
          margin-top: 18px;
          flex-wrap: wrap;
          border-radius: 28px;
        }
        .pill {
          height: 48px;
          padding: 0 20px;
          font-size: 15px;
        }
        #closeBtn {
          top: 18px;
          left: auto;
          right: 18px;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          transition-duration: 0.01s !important;
        }
      }

      .webgl-fail {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        color: var(--lav);
        font-size: 18px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="hero-word"><span>MEMORIES</span></div>

    <canvas id="gl"></canvas>

    <nav>
      <div class="nav-r">
        <button class="menu-btn" id="uploadBtn" aria-label="上传照片">＋</button>
        <button class="cta" id="collectionBtn">我的收藏</button>
      </div>
    </nav>

    <button id="openBtn">Open</button>
    <button id="closeBtn" aria-label="Close detail view">&#10005;</button>
    <input id="photoUpload" type="file" accept="image/*" hidden>
    <div id="toast" role="status"></div>
    <div id="timeline" aria-label="成长时间轴">
      <button data-album="0">夏日 · 奔跑</button>
      <button data-album="1">雨夜 · 探索</button>
      <button data-album="2">午后 · 长大</button>
    </div>

    <div class="dp" id="dp" aria-live="polite">
      <h1 id="dpTitle"></h1>
      <p id="dpDesc"></p>
      <div class="meta">
        <div class="stars" id="dpStars"></div>
        <div class="sep"></div>
        <div class="src">PHOTO ALBUM</div>
        <div class="year" id="dpYear"></div>
      </div>
      <div class="rule"></div>
      <div class="actions">
        <button class="pill lang">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <circle cx="12" cy="12" r="9" />
            <path
              d="M3 12h18M12 3c2.8 2.6 2.8 15.4 0 18M12 3c-2.8 2.6-2.8 15.4 0 18"
            />
          </svg>
          <span>私藏相册</span>
        </button>
        <button class="pill buy">查看照片</button>
        <button class="pill buy" id="memorySound">播放回忆</button>
        <button class="pill buy" id="exportCard">生成纪念卡</button>
        <button class="pill iconb" aria-label="收藏">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M7 3h10v18l-5-4-5 4z" />
          </svg>
        </button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      /* =========================================================================
   0. Small utilities
   ========================================================================= */
      const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      document.body.classList.add(new Date().getHours() >= 7 && new Date().getHours() < 18 ? "day" : "night");

      class Spring {
        constructor(v, k, d) {
          this.v = v;
          this.t = v;
          this.vel = 0;
          this.k = k || 120;
          this.d = d || 14;
        }
        set(v) {
          this.v = v;
          this.t = v;
          this.vel = 0;
          return this;
        }
        update(dt) {
          const a = this.k * (this.t - this.v) - this.d * this.vel;
          this.vel += a * dt;
          this.v += this.vel * dt;
          return this.v;
        }
      }

      function mkCanvas(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return c;
      }

      function drawSpaced(x, text, cx, y, ls) {
        const prev = x.textAlign;
        x.textAlign = "left";
        const chars = [...text];
        let tot = 0;
        const ws = chars.map((ch) => {
          const w = x.measureText(ch).width;
          tot += w;
          return w;
        });
        tot += ls * (chars.length - 1);
        let px = cx - tot / 2;
        chars.forEach((ch, i) => {
          x.fillText(ch, px, y);
          px += ws[i] + ls;
        });
        x.textAlign = prev;
      }

      function rr(x, px, py, w, h, r) {
        x.beginPath();
        x.moveTo(px + r, py);
        x.arcTo(px + w, py, px + w, py + h, r);
        x.arcTo(px + w, py + h, px, py + h, r);
        x.arcTo(px, py + h, px, py, r);
        x.arcTo(px, py, px + w, py, r);
        x.closePath();
      }

      /* =========================================================================
   1. Renderer, scene, camera, lights
   ========================================================================= */
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("gl"),
          antialias: true,
          alpha: true,
        });
      } catch (e) {
        document.body.insertAdjacentHTML(
          "beforeend",
          '<div class="webgl-fail">This experience needs WebGL, which your browser blocked or does not support.</div>',
        );
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      /* held just under 1 so cover art keeps its printed saturation instead of
         being rolled off toward white by the filmic curve */
      renderer.toneMappingExposure = 0.92;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const ANISO = renderer.capabilities.getMaxAnisotropy();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        26,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 0.1, 9.6);

      /* studio environment: painted equirect, prefiltered */
      function envBlob(x, cx, cy, r, rgb, a) {
        const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, "rgba(" + rgb + "," + a + ")");
        g.addColorStop(1, "rgba(" + rgb + ",0)");
        x.fillStyle = g;
        x.beginPath();
        x.arc(cx, cy, r, 0, 6.2832);
        x.fill();
      }
      (function buildEnv() {
        const c = mkCanvas(512, 256),
          x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0, "#b89a74");
        g.addColorStop(0.55, "#4b392e");
        g.addColorStop(1, "#17110d");
        x.fillStyle = g;
        x.fillRect(0, 0, 512, 256);
        envBlob(x, 140, 66, 95, "255,255,255", 0.95); // key
        envBlob(x, 405, 84, 55, "255,214,168", 0.55); // warm kicker
        envBlob(x, 256, 150, 120, "255,155,185", 0.28); // pink wash
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromEquirectangular(tex).texture;
        tex.dispose();
        pmrem.dispose();
      })();

      const hemi = new THREE.HemisphereLight(0xe9d5b5, 0x160f0b, 0.36);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffe4bf, 1.08);
      key.position.set(3.5, 5, 6);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 4;
      key.shadow.camera.bottom = -4;
      key.shadow.camera.near = 1;
      key.shadow.camera.far = 20;
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.02;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xb9c9df, 0.28);
      fill.position.set(-4, 1, 4);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xf0b87a, 0.38);
      rim.position.set(-2, 3, -5);
      scene.add(rim);

      /* everything book-related lives under one root so it can be fit-scaled */
      const bookRoot = new THREE.Group();
      scene.add(bookRoot);

      /* Single-photo portrait reconstruction: dimensional silhouette and glasses
         are geometry; the supplied front view is used as the facial texture. */
      const portraitAvatar = new THREE.Group();
      portraitAvatar.visible = false;
      portraitAvatar.position.set(1.75, -0.42, 0.25);
      portraitAvatar.scale.setScalar(0.72);
      const skin = new THREE.MeshStandardMaterial({ color: 0xc88768, roughness: 0.75 });
      const hair = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 });
      const frame = new THREE.MeshStandardMaterial({ color: 0x201719, metalness: 0.55, roughness: 0.25 });
      const lens = new THREE.MeshPhysicalMaterial({ color: 0x4e3033, transparent: true, opacity: 0.42, roughness: 0.08, metalness: 0.2 });
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.68, 32, 24), skin);
      head.scale.set(0.92, 1.17, 0.78); head.position.y = 0.44; portraitAvatar.add(head);
      const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 20, 0, Math.PI * 2, 0, 1.45), hair);
      hairCap.scale.set(0.96, 0.72, 0.82); hairCap.position.set(0, 0.98, 0.02); portraitAvatar.add(hairCap);

      function tex(c) {
        const t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = ANISO;
        return t;
      }

      function noiseTexture(base, amp, scratches) {
        const s = 256,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        const img = x.createImageData(s, s),
          d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = base + (Math.random() - 0.5) * 2 * amp;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
        if (scratches) {
          x.strokeStyle = "rgba(200,200,200,.25)";
          x.lineWidth = 1;
          for (let i = 0; i < 5; i++) {
            x.beginPath();
            const y = Math.random() * s;
            x.moveTo(0, y);
            x.lineTo(s, y + (Math.random() - 0.5) * 22);
            x.stroke();
          }
        }
        return new THREE.CanvasTexture(c);
      }
      const laminateBump = noiseTexture(128, 10, true);
      const clothBump = (function () {
        const s = 128,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        x.fillStyle = "#808080";
        x.fillRect(0, 0, s, s);
        for (let i = 0; i < s; i += 2) {
          x.fillStyle =
            i % 4 === 0 ? "rgba(255,255,255,.22)" : "rgba(0,0,0,.22)";
          x.fillRect(i, 0, 1, s);
          x.fillRect(0, i, s, 1);
        }
        return new THREE.CanvasTexture(c);
      })();
      const woodGrainTex = (function () {
        const c = mkCanvas(512, 128), x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, 0, 128);
        g.addColorStop(0, "#3a2115"); g.addColorStop(.45, "#815334"); g.addColorStop(1, "#2a1710");
        x.fillStyle = g; x.fillRect(0, 0, 512, 128);
        for (let i = 0; i < 95; i++) {

          x.stroke();

        const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.2, 1);
        return t;
      })();

      function striationTexture(vertical) {
        const s = 512,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        x.fillStyle = "#ece4d2";
        x.fillRect(0, 0, s, s);
        let p = 0;
        while (p < s) {
          const w = 1 + Math.random() * 2.4,
            tone = Math.random();
          x.fillStyle =
            tone < 0.12
              ? "rgba(140,125,95,.5)"
              : tone < 0.5
                ? "rgba(255,255,252,.55)"
                : "rgba(190,178,150,.45)";
          if (vertical) x.fillRect(p, 0, w, s);
          else x.fillRect(0, p, s, w);
          p += w + 0.6 + Math.random() * 1.6;
        }
        for (let i = 0; i < 2600; i++) {
          x.fillStyle =
            "rgba(120,108,84," + (Math.random() * 0.1).toFixed(3) + ")";
          x.fillRect(Math.random() * s, Math.random() * s, 1.2, 1.2);
        }
        return tex(c);
      }

        g.addColorStop(1, "rgba(0,0,0,.07)");
        x.fillStyle = g;

        return tex(c);
      })();

      function paintAlchemist(x, w, h) {
        const RED = "#af2024",
          ORANGE = "#e8501f",
          GOLD = "#f2b31c",
          INK = "#2a1508";
        x.fillStyle = RED;
        x.fillRect(0, 0, w, h);
        x.fillStyle = ORANGE;
        x.fillRect(38, 38, w - 76, h - 76);
        x.strokeStyle = GOLD;
        x.lineWidth = 3;
        x.strokeRect(20, 20, w - 40, h - 40);

        const cx = w / 2,
          cy = 700,
          R = 292;
        x.save();
        x.beginPath();
        x.rect(38, 38, w - 76, h - 76);
        x.clip();

        /* radiating rays + diamond studs */
        for (let i = 0; i < 32; i++) {
          const a = (i / 32) * 6.2832 + 0.098;
          x.save();
          x.translate(cx, cy);
          x.rotate(a);
          x.fillStyle = "rgba(242,179,28,.85)";
          x.beginPath();
          x.moveTo(R + 8, -13);
          x.lineTo(1180, 0);
          x.lineTo(R + 8, 13);
          x.closePath();
          x.fill();
          for (let d = 0; d < 4; d++) {
            const rd = R + 120 + d * 190,
              sz = 20 - d * 2;
            x.fillStyle = d % 2 ? "rgba(242,179,28,.95)" : "rgba(175,32,36,.9)";
            x.beginPath();
            x.moveTo(rd, -sz);
            x.lineTo(rd + sz, 0);
            x.lineTo(rd, sz);
            x.lineTo(rd - sz, 0);
            x.closePath();
            x.fill();
          }
          x.restore();
        }

        /* scalloped medallion */
        x.fillStyle = "#b8351f";
        for (let i = 0; i < 30; i++) {
          const a = (i / 30) * 6.2832;
          x.beginPath();
          x.arc(cx + Math.cos(a) * R, cy + Math.sin(a) * R, 34, 0, 6.2832);
          x.fill();
        }
        x.fillStyle = GOLD;
        x.beginPath();
        x.arc(cx, cy, R - 4, 0, 6.2832);
        x.fill();
        x.strokeStyle = "#b8351f";
        x.lineWidth = 7;
        x.beginPath();
        x.arc(cx, cy, R - 26, 0, 6.2832);
        x.stroke();
        x.fillStyle = "#b8351f";
        for (let i = 0; i < 64; i++) {
          const a = (i / 64) * 6.2832;
          x.beginPath();
          x.arc(cx + Math.cos(a) * (R - 46), cy + Math.sin(a) * (R - 46), 5, 0, 6.2832);
          x.fill();
        }
        /* faint map contours inside the medallion */
        x.save();
        x.beginPath();
        x.arc(cx, cy, R - 56, 0, 6.2832);
        x.clip();
        x.strokeStyle = "rgba(199,100,0,.55)";
        x.lineWidth = 4;
        for (let i = 0; i < 5; i++) {
          const yy = cy - 150 + i * 78;
          x.beginPath();
          x.moveTo(cx - 240, yy);
          x.bezierCurveTo(cx - 90, yy - 34, cx + 80, yy + 34, cx + 240, yy - 6);
          x.stroke();
        }
        x.restore();
        x.restore();

        /* title block, sized to sit inside the medallion */
        x.fillStyle = INK;
        x.textAlign = "center";
        x.font = "italic 74px Georgia";
        x.fillText("The", cx, 638);
        x.textAlign = "left";
        x.font = "700 78px Georgia";
        drawSpaced(x, "ALCHEMIST", cx, 748, 3);
        x.textAlign = "center";
        x.fillStyle = "#8f2a12";
        x.font = "italic 40px Georgia";
        x.fillText("25th", cx, 826);
        x.textAlign = "left";
        x.font = "600 20px Arial";
        drawSpaced(x, "ANNIVERSARY", cx, 862, 6);
        drawSpaced(x, "EDITION", cx, 890, 6);

        /* author + corner glyphs */
        x.fillStyle = INK;
        x.font = "700 66px Georgia";
        drawSpaced(x, "PAULO COELHO", cx, 1382, 4);
        x.fillStyle = "rgba(242,179,28,.9)";
        [
          [140, 1400],
          [w - 140, 1400],
        ].forEach(([px, py]) => {
          x.beginPath();
          x.moveTo(px, py - 62);
          x.lineTo(px + 58, py);
          x.lineTo(px - 58, py);
          x.closePath();
          x.fill();
        });
        [
          [128, 118],
          [w - 128, 118],
        ].forEach(([px, py]) => {
          x.beginPath();
          x.moveTo(px - 46, py);
          x.quadraticCurveTo(px - 14, py - 30, px, py + 6);
          x.quadraticCurveTo(px + 14, py - 30, px + 46, py);
          x.quadraticCurveTo(px + 12, py + 4, px, py + 30);
          x.quadraticCurveTo(px - 12, py + 4, px - 46, py);
          x.closePath();
          x.fill();
        });
      }

        x.font = "italic 34px Georgia"; x.fillStyle = "#7b5e45";
        x.fillText(cfg.author, 150, 270); x.fillText(cfg.year, w - 390, 270);
        const note = cfg.note || cfg.desc;
        x.font = "italic 38px Georgia"; x.fillStyle = "#49372a";
        const chars = [...note]; let line = "", lines = [];
        chars.forEach(ch => { if (x.measureText(line + ch).width > w - 320) { lines.push(line); line = ch; } else line += ch; });
        if (line) lines.push(line);
        lines.slice(0, 5).forEach((s, i) => x.fillText(s, 160, 380 + i * 76));
        x.fillStyle = "rgba(144,91,55,.72)";
        [[w-230,h-210,30],[w-175,h-165,24],[w-120,h-210,30]].forEach(([px,py,r])=>{x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();});
        x.beginPath(); x.ellipse(w - 175, h - 115, 62, 48, 0, 0, Math.PI * 2); x.fill();
      }

      function paintSpine(x, w, h, cfg) {
        x.fillStyle = cfg.spineBg;
        x.fillRect(0, 0, w, h);
        x.save();
        x.translate(w / 2, h / 2);
        x.rotate(Math.PI / 2);
        x.fillStyle = cfg.spineInk;
        x.font = cfg.spineFont;
        drawSpaced(x, cfg.title.toUpperCase(), -h * 0.1, 15, 6);
        x.globalAlpha = 0.85;
        x.font = "600 25px Arial";
        drawSpaced(x, cfg.author.toUpperCase(), h * 0.325, 9, 4);
        x.globalAlpha = 1;
        x.restore();
        x.fillStyle = cfg.spineInk;
        x.globalAlpha = 0.6;
        x.fillRect(w / 2 - 26, 92, 52, 3);
        x.fillRect(w / 2 - 26, h - 95, 52, 3);
        x.globalAlpha = 1;
      }

      /* Painterly photographic placeholders for albums that do not yet have a
         real local image. They read as prints, not interface cards. */
      function paintAlbum(x, w, h, cfg) {
        const sky = x.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, cfg.photoA[0]);
        sky.addColorStop(.58, cfg.photoA[1]);
        sky.addColorStop(1, cfg.photoB[0]);
        x.fillStyle = sky; x.fillRect(0, 0, w, h);

        /* atmospheric sun / city glow */
        const glow = x.createRadialGradient(w * .68, h * .34, 5, w * .68, h * .34, h * .32);
        glow.addColorStop(0, "rgba(255,238,194,.9)");
        glow.addColorStop(1, "rgba(255,220,170,0)");
        x.fillStyle = glow; x.fillRect(0, 0, w, h);

        /* layered distant landscape and foreground */
        x.fillStyle = cfg.photoB[1];
        x.beginPath(); x.moveTo(0, h * .7);
        x.bezierCurveTo(w * .18, h * .5, w * .32, h * .72, w * .5, h * .55);
        x.bezierCurveTo(w * .68, h * .38, w * .82, h * .68, w, h * .48);
        x.lineTo(w, h); x.lineTo(0, h); x.closePath(); x.fill();
        x.fillStyle = cfg.photoC[0];
        x.beginPath(); x.moveTo(0, h * .82);
        x.bezierCurveTo(w * .2, h * .64, w * .38, h * .86, w * .57, h * .7);
        x.bezierCurveTo(w * .75, h * .56, w * .88, h * .8, w, h * .64);
        x.lineTo(w, h); x.lineTo(0, h); x.closePath(); x.fill();

        /* subtle analogue grain and edge falloff */
        for (let i = 0; i < 1800; i++) {
          const a = .015 + (i % 7) * .004;
          x.fillStyle = `rgba(255,245,225,${a})`;
          x.fillRect((i * 977) % w, (i * 613) % h, 1.2, 1.2);
        }
        const vignette = x.createRadialGradient(w / 2, h / 2, h * .2, w / 2, h / 2, w * .7);
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(18,10,5,.38)");
        x.fillStyle = vignette; x.fillRect(0, 0, w, h);
      }

      const BOOKS = [
        {
          id: "sunny-day",
          title: "奔向晴天",
          author: "草地 · 夏日收藏",
          year: "24 张照片",
          stars: 5,
          desc: "迎着午后的阳光跑过草地，卷起的小尾巴和笑脸都被镜头留了下来。",
          front: paintAlbum,
          edge: "#f6ead3", backBg: "#e98d73", backInk: "255,248,235",
          spineBg: "#e98d73", spineInk: "#fff8eb", spineFont: "700 38px Georgia",
          photoA: ["#f6b46d", "#e86b62"], photoB: ["#3f9eaa", "#a9d5c8"], photoC: ["#efcf9b", "#d77a67"],
          coverURL: "./shiba-meadow.png",
        },
        {
          id: "city",
          title: "雨夜散步",
          author: "上海 · 蓝调时刻",
          year: "18 张照片",
          stars: 4,
          desc: "雨后的街灯映在路面，小家伙站在屋檐下，好奇地看着刚刚安静下来的城市。",
          front: paintAlbum,
          edge: "#e7e1f0", backBg: "#62629b", backInk: "245,242,255",
          spineBg: "#62629b", spineInk: "#f7f1ff", spineFont: "700 38px Georgia",
          photoA: ["#312d55", "#7c6fbe"], photoB: ["#d0657e", "#f0a071"], photoC: ["#1d5472", "#79b6bc"],
          coverURL: "./shiba-rainy-night.png",
        },
        {
          id: "home",
          title: "午后小憩",
          author: "家中 · 温暖日常",
          year: "31 张照片",
          stars: 5,
          desc: "阳光落在亚麻沙发上，它抱着熟悉的蓝色兔子，睡成一个暖乎乎的小圆圈。",
          front: paintAlbum,
          edge: "#dbece8", backBg: "#4d9c91", backInk: "241,255,250",
          spineBg: "#4d9c91", spineInk: "#f0fff8", spineFont: "700 38px Georgia",
          photoA: ["#e3a66e", "#d86e70"], photoB: ["#8fbf9e", "#3c7b79"], photoC: ["#f3ddad", "#bd8175"],
          coverURL: "./shiba-sunny-nap.png",
        },
      ];

      /* =========================================================================
   4. Floating photo-frame construction
   ========================================================================= */
      const W = 2.05,
        H = 1.52,
        T = 0.12,
        CT = 0.065,
        OV = 0.04;
      const PAGE_N = 12,
        PW = W - 0.02,
        PH = H - 0.02;
      const BLOCK_D = 0.08,
        BLOCK_Z = -0.02,
        PIVOT_Z = T / 2 + CT / 2,
        BPIVOT_Z = -(T / 2 + CT / 2);

      const coverGeo = new THREE.BoxGeometry(W + OV, H + OV * 2, CT);
      const blockGeo = new THREE.BoxGeometry(W - 0.015, H, BLOCK_D);
      const pageGeo = new THREE.PlaneGeometry(PW, PH);
      const spineGeo = new THREE.BoxGeometry(
        0.028,
        H + OV * 2,
        T + CT * 2 + 0.006,
      );
      const hitGeo = new THREE.BoxGeometry(2.35, 1.8, 0.7);
      const blobGeo = new THREE.PlaneGeometry(1, 1);
      const hitMat = new THREE.MeshBasicMaterial({ visible: false });

      function std(o) {
        return new THREE.MeshStandardMaterial(
          Object.assign({ metalness: 0.02 }, o),
        );
      }

      const paperFlat = std({
        color: 0xf2ecdd,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const striMatV = std({
        map: striV,
        bumpMap: striV,
        bumpScale: 0.0025,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const striMatH = std({
        map: striH,
        bumpMap: striH,
        bumpScale: 0.0025,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const endpaperMat = std({
        map: endpaperTex,
        roughness: 0.9,
        envMapIntensity: 0.25,
      });
      const pageMats = [0xf4eee0, 0xf1ebdb, 0xf6f0e3].map((c) =>
        std({
          color: c,
          roughness: 0.92,
          envMapIntensity: 0.22,
          side: THREE.DoubleSide,
        }),
      );

      const books = [];
      const hitMeshes = [];

      function buildBook(cfg, index) {
        const root = new THREE.Group();
        const float = new THREE.Group();
        root.add(float);
        bookRoot.add(root);

        /* painted textures */
        const fc = mkCanvas(1400, 1000);
        cfg.front(fc.getContext("2d"), 1400, 1000, cfg);
        const bc = mkCanvas(1400, 1000);
        paintBack(bc.getContext("2d"), 1400, 1000, cfg);
        const sc = mkCanvas(220, 1536);
        paintSpine(sc.getContext("2d"), 220, 1536, cfg);
        const frontTex = tex(fc),
          backTex = tex(bc),
          spineTex = tex(sc);

        /* printed boards: matte enough that the environment reads as a soft sheen
           rather than a wash over the artwork */
        const mEdge = std({
          color: cfg.edge,
          bumpMap: laminateBump,
          bumpScale: 0.0035,
          roughness: 0.68,
          envMapIntensity: 0.3,
        });
        const mFront = std({
          map: frontTex,
          bumpMap: laminateBump,
          bumpScale: 0.0035,
          roughness: 0.54,
          envMapIntensity: 0.28,
        });
        const mBack = std({
          map: backTex,
          bumpMap: laminateBump,
          bumpScale: 0.0035,
          roughness: 0.58,
          envMapIntensity: 0.26,
        });
        const mSpine = std({
          map: spineTex,
          bumpMap: clothBump,
          bumpScale: 0.006,
          roughness: 0.78,
          envMapIntensity: 0.22,
        });

        /* optional real cover art, CORS permitting */
        if (cfg.coverURL) {
          new THREE.TextureLoader().setCrossOrigin("anonymous").load(
            cfg.coverURL,
            (t) => {
              t.encoding = THREE.sRGBEncoding;
              t.anisotropy = ANISO;
              /* Preserve portrait proportions inside the landscape frame by
                 cropping vertically around the face instead of stretching. */
              if (t.image && t.image.width && t.image.height) {
                const imageAspect = t.image.width / t.image.height;
                const frameAspect = W / H;
                if (imageAspect < frameAspect) {
                  const visibleY = imageAspect / frameAspect;
                  t.repeat.set(1, visibleY);
                  t.offset.set(0, (1 - visibleY) * 0.58);
                }
              }
              mFront.map = t;
              mFront.needsUpdate = true;
            },
            undefined,
            () =>
              console.warn(
                "Cover blocked by CORS, procedural kept:",
                cfg.title,
              ),
          );
        }

        /* Compatibility group retained for the existing orbit state machine. */
        const backPivot = new THREE.Group();
        backPivot.position.set(-W / 2, 0, BPIVOT_Z);
        const backMesh = new THREE.Mesh(coverGeo, [
          mEdge,
          mEdge,
          mEdge,
          mEdge,
          endpaperMat,
          mBack,
        ]);
        backMesh.position.x = (W + OV) / 2;
        backMesh.castShadow = backMesh.receiveShadow = true;
        backPivot.add(backMesh);
        backPivot.visible = false;
        float.add(backPivot);

        /* Main framed photograph panel. */
        const pivot = new THREE.Group();
        pivot.position.set(-W / 2, 0, PIVOT_Z);
        const frontMesh = new THREE.Mesh(coverGeo, [
          mEdge,
          mEdge,
          mEdge,
          mEdge,
          mFront,
          mBack,
        ]);
        frontMesh.position.x = (W + OV) / 2;
        frontMesh.castShadow = frontMesh.receiveShadow = true;
        pivot.add(frontMesh);

        /* A physical framed print lifts each album from a flat book cover.
           The rails sit in front of the board, with an inset print and glass. */
        const frameStyle = [
          {
            kind: "walnut", rail: 0.14, depth: 0.2, inset: 0.085,
            outer: { color: 0xffffff, map: woodGrainTex, bumpMap: woodGrainTex, bumpScale: 0.014, roughness: 0.45, metalness: 0.02 },
            inner: { color: 0xb68b43, roughness: 0.2, metalness: 0.72 },
            mat: 0xeee4ce,
          },
          {
            kind: "titanium", rail: 0.055, depth: 0.095, inset: 0.038,
            outer: { color: 0x17191c, roughness: 0.2, metalness: 0.78 },
            inner: { color: 0xb76048, roughness: 0.26, metalness: 0.66 },
            mat: 0x23262a,
          },
          {
            kind: "oak", rail: 0.18, depth: 0.135, inset: 0.12,
            outer: { color: 0xd0a978, bumpMap: woodGrainTex, bumpScale: 0.009, roughness: 0.72, metalness: 0.01 },
            inner: { color: 0x73806a, roughness: 0.5, metalness: 0.16 },
            mat: 0xd9d0bb,
          },
        ][index];
        const frameWood = std(Object.assign({ envMapIntensity: 0.72 }, frameStyle.outer));
        const frameGold = std(Object.assign({ envMapIntensity: 1 }, frameStyle.inner));
        const matBoard = std({ color: frameStyle.mat, roughness: 0.97, envMapIntensity: 0.1 });
        const railZ = CT / 2 + frameStyle.depth * 0.46;
        const frameW = W * (index === 1 ? 0.95 : index === 2 ? 0.9 : 0.92);
        const frameH = H * (index === 1 ? 0.91 : index === 2 ? 0.82 : 0.86);
        const rail = frameStyle.rail;
        const frameX = W / 2, frameY = 0;
        [
          [frameW + rail * 2, rail, frameX, frameY + frameH / 2],
          [frameW + rail * 2, rail, frameX, frameY - frameH / 2],
          [rail, frameH, frameX - frameW / 2, frameY],
          [rail, frameH, frameX + frameW / 2, frameY],
        ].forEach(([rw, rh, rx, ry]) => {
          const railMesh = new THREE.Mesh(new THREE.BoxGeometry(rw, rh, frameStyle.depth), frameWood);
          railMesh.position.set(rx, ry, railZ);
          railMesh.castShadow = railMesh.receiveShadow = true;
          pivot.add(railMesh);
        });
        const matW = frameW - rail * 1.15, matH = frameH - rail * 1.15, mat = frameStyle.inset;
        [
          [matW, mat, frameX, frameY + matH / 2],
          [matW, mat, frameX, frameY - matH / 2],
          [mat, matH, frameX - matW / 2, frameY],
          [mat, matH, frameX + matW / 2, frameY],
        ].forEach(([rw, rh, rx, ry]) => {
          const matRail = new THREE.Mesh(new THREE.BoxGeometry(rw, rh, 0.045), matBoard);
          matRail.position.set(rx, ry, railZ + 0.035);
          matRail.receiveShadow = true;
          pivot.add(matRail);
        });
        const lipW = matW - mat * 1.05, lipH = matH - mat * 1.05, lip = 0.024;
        [
          [lipW, lip, frameX, frameY + lipH / 2],
          [lipW, lip, frameX, frameY - lipH / 2],
          [lip, lipH, frameX - lipW / 2, frameY],
          [lip, lipH, frameX + lipW / 2, frameY],
        ].forEach(([rw, rh, rx, ry]) => {
          const goldLip = new THREE.Mesh(new THREE.BoxGeometry(rw, rh, 0.04), frameGold);
          goldLip.position.set(rx, ry, railZ + 0.065);
          pivot.add(goldLip);
        });
        if (frameStyle.kind === "titanium") {
          const boltMat = std({ color: 0xc8cdd2, roughness: 0.18, metalness: 0.9 });
          [
            [frameX - frameW / 2, frameY - frameH / 2],
            [frameX + frameW / 2, frameY - frameH / 2],
            [frameX - frameW / 2, frameY + frameH / 2],
            [frameX + frameW / 2, frameY + frameH / 2],
          ].forEach(([bx, by]) => {
            const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.022, 18), boltMat);
            bolt.rotation.x = Math.PI / 2;
            bolt.position.set(bx, by, railZ + frameStyle.depth / 2 + 0.016);
            pivot.add(bolt);
          });
        }
        if (frameStyle.kind === "oak") {
          const pegMat = std({ color: 0x9b724d, roughness: 0.78 });
          [-1, 1].forEach((side) => {
            const peg = new THREE.Mesh(new THREE.SphereGeometry(0.055, 18, 12), pegMat);
            peg.position.set(frameX + side * (frameW / 2 + rail * 0.48), frameY, railZ + 0.085);
            pivot.add(peg);
          });
        }
        const glass = new THREE.Mesh(
          new THREE.PlaneGeometry(frameW - rail * 0.35, frameH - rail * 0.35),
          new THREE.MeshPhysicalMaterial({
            color: 0xe7f3ff, transparent: true, opacity: 0.16,
            roughness: 0.025, metalness: 0.08, side: THREE.DoubleSide,
          }),
        );
        glass.position.set(frameX, frameY, railZ + 0.082);
        pivot.add(glass);

        /* Rear kickstand makes the object read as a frame from every angle. */
        const stand = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, H * 0.72, 0.09),
          frameWood,
        );
        stand.position.set(frameX, -H * 0.18, -0.13);
        stand.rotation.x = -0.28;
        stand.castShadow = true;
        pivot.add(stand);
        float.add(pivot);

        /* cloth spine */
        const spine = new THREE.Mesh(spineGeo, mSpine);
        spine.position.set(-W / 2 - 0.013, 0, 0);
        spine.castShadow = true;
        float.add(spine);
        spine.visible = false;

        /* page block with striated edges */
        const block = new THREE.Mesh(blockGeo, [
          striMatV,
          paperFlat,
          striMatH,
          striMatH,
          paperFlat,
          paperFlat,
        ]);
        block.position.set(-0.0075, 0, BLOCK_Z);
        block.castShadow = block.receiveShadow = true;
        float.add(block);
        block.visible = false;

        /* individually hinged top sheets */
        const pages = [],
          pageF = [];
        for (let i = 0; i < PAGE_N; i++) {
          const pp = new THREE.Group();
          pp.position.set(
            -W / 2 + 0.01,
            (Math.random() - 0.5) * 0.006,
            0.166 - i * 0.0042,
          );
          const pm = new THREE.Mesh(pageGeo, pageMats[i % 3]);
          pm.position.x = PW / 2;
          pm.rotation.z = (Math.random() - 0.5) * 0.006;
          pp.add(pm);
          float.add(pp);
          pp.visible = false;
          pages.push(pp);
          pageF.push(0.3 * Math.pow(1 - i / PAGE_N, 2.6));
        }

        /* hinged rear sheets, revealed when the back cover fans */
        const pagesB = [],
          pageFB = [];
        for (let i = 0; i < 6; i++) {
          const pp = new THREE.Group();
          pp.position.set(
            -W / 2 + 0.01,
            (Math.random() - 0.5) * 0.006,
            -0.166 + i * 0.0042,
          );
          const pm = new THREE.Mesh(pageGeo, pageMats[i % 3]);
          pm.position.x = PW / 2;
          pm.rotation.z = (Math.random() - 0.5) * 0.006;
          pp.add(pm);
          float.add(pp);
          pp.visible = false;
          pagesB.push(pp);
          pageFB.push(0.3 * Math.pow(1 - i / 6, 2.6));
        }

        /* soft blob shadow against the background */
        const blob = new THREE.Mesh(
          blobGeo,
          new THREE.MeshBasicMaterial({
            map: blobTex,
            transparent: true,
            opacity: 0.45,
            depthWrite: false,
          }),
        );
        blob.scale.set(3.1, 3.9, 1);
        blob.position.set(0.1, -0.3, -0.85);
        blob.renderOrder = -5;
        root.add(blob);

        /* invisible raycast target */
        const hit = new THREE.Mesh(hitGeo, hitMat);
        float.add(hit);
        hitMeshes.push(hit);

        const springs = {
          px: new Spring(0, 17, 6.8),
          py: new Spring(0, 17, 6.8),
          pz: new Spring(0, 17, 6.8),
          rx: new Spring(0, 17, 6.8),
          ry: new Spring(0, 17, 6.8),
          rz: new Spring(0, 17, 6.8),
          sc: new Spring(1, 17, 6.8),
          tiltX: new Spring(0, 120, 13),
          tiltY: new Spring(0, 120, 13),
          lift: new Spring(0, 120, 13),
          cover: new Spring(0, 90, 12),
          coverB: new Spring(0, 90, 12),
          drag: new Spring(0, 160, 16),
        };

        const b = {
          cfg,
          index,
          root,
          float,
          pivot,
          backPivot,
          frontMesh,
          spine,
          block,
          pages,
          pageF,
          pagesB,
          pageFB,
          hit,
          springs,
          phase: Math.random() * 6.28,
          slotScale: 1,
          hitEdge: null,
          scr: { x: 0, y: 0 },
          orbY: 0,
          orbYv: 0,
          orbPhase: "idle",
          orbTarget: 0,
          orbXs: new Spring(0, 60, 12),
          tableVX: 0,
          tableVZ: 0,
          exit: null,
        };
        books.push(b);
        return b;
      }
      BOOKS.forEach(buildBook);
      const bookByHit = (m) => books.find((b) => b.hit === m);

      /* =========================================================================
   5. Floating leaves (detail view)
   ========================================================================= */
      const leaves = { items: [], anchor: null };
      (function buildLeaves() {
        const shape = new THREE.Shape();
        shape.moveTo(0, -0.5);
        shape.bezierCurveTo(0.3, -0.28, 0.3, 0.22, 0, 0.55);
        shape.bezierCurveTo(-0.3, 0.22, -0.3, -0.28, 0, -0.5);
        const geo = new THREE.ShapeGeometry(shape, 10);
        const cols = [0x3e7c3f, 0x57944a, 0x2f6136, 0x6aa557];
        for (let i = 0; i < 16; i++) {
          const mat = std({
            color: cols[i % 4],
            roughness: 0.55,
            envMapIntensity: 0.3,
            side: THREE.DoubleSide,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.visible = false;
          bookRoot.add(mesh);
          let hx = (Math.random() - 0.5) * 4.6;
          if (i % 5 === 0) hx += 2.8 * Math.sign(hx || 1);
          leaves.items.push({
            mesh,
            hx,
            hy: (Math.random() - 0.5) * 3.2,
            hz: -0.5 + Math.random() * 1.5,
            sp: 0.25 + Math.random() * 0.5,
            ph: Math.random() * 6.28,
            rv: new THREE.Vector3(
              (Math.random() - 0.5) * 0.8,
              (Math.random() - 0.5) * 0.8,
              (Math.random() - 0.5) * 0.8,
            ),
            kick: new THREE.Vector3(),
            size: 0.14 + Math.random() * 0.16,
            s: new Spring(0, 60, 10),
          });
        }
      })();
      leaves.activate = function (book) {
        this.anchor = book;
        this.items.forEach((l) => {
          l.kick.set(
            -l.hx + (Math.random() - 0.5) * 0.6,
            -l.hy + (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 0.5,
          );
          l.s.t = l.size;
          l.mesh.visible = true;
        });
      };
      leaves.deactivate = function () {
        this.items.forEach((l) => {
          l.s.t = 0;
        });
      };
      leaves.push = function (dx, dy) {
        if (!this.anchor) return;
        this.items.forEach((l) => {
          l.kick.x += dx * 2.4 * Math.random();
          l.kick.y += -dy * 2.4 * Math.random();
        });
      };
      leaves.update = function (dt, t) {
        if (!this.anchor) return;
        const ap = this.anchor.root.position;
        const w = RM ? 0.15 : 1;
        this.items.forEach((l) => {
          l.kick.multiplyScalar(Math.exp(-1.15 * dt));
          l.mesh.position.set(
            ap.x + l.hx + Math.sin(t * l.sp + l.ph) * 0.4 * w + l.kick.x,
            ap.y +
              l.hy +
              Math.cos(t * l.sp * 0.83 + l.ph * 1.3) * 0.3 * w +
              l.kick.y,
            ap.z * 0.4 + l.hz + l.kick.z,
          );
          l.mesh.rotation.x += l.rv.x * dt * (0.3 + w);
          l.mesh.rotation.y += l.rv.y * dt * (0.3 + w);
          l.mesh.rotation.z += l.rv.z * dt * (0.3 + w);
          const s = l.s.update(dt);

          if (l.s.t === 0 && s < 0.01) l.mesh.visible = false;

      };

      /* =========================================================================
   6. Layout slots + state machine
   ========================================================================= */
      const state = {

        hovered: null,
        pillLock: null,
        kbIndex: -1,

          ? [
              { p: [-1.15, -0.92, -0.15], r: [-0.06, 0.34, 0.13], s: 1.08 },
              { p: [0.12, -0.18, 0.65], r: [-0.04, -0.06, -0.025], s: 1.18 },
              { p: [1.35, -1.0, -0.28], r: [-0.04, -0.34, -0.12], s: 1.08 },
            ]
          : [
              { p: [-2.35, -0.72, -0.12], r: [-0.08, 0.38, 0.11], s: 1.16 },
              { p: [0.05, -0.42, 0.62], r: [-0.05, -0.05, -0.02], s: 1.28 },
              { p: [2.35, -0.78, -0.25], r: [-0.06, -0.38, -0.1], s: 1.16 },
            ];
        SLOTS.collection = SLOTS.portrait
          ? [
              { p: [-1.05, -1.3, 0.65], r: [-1.18, 0.08, -0.28], s: .92 },
              { p: [0.18, -1.22, -0.15], r: [-1.2, -0.06, 0.18], s: .98 },
              { p: [1.2, -1.28, 0.78], r: [-1.16, 0.1, -0.12], s: .9 },
            ]
          : [
              { p: [-2.0, -1.28, 0.65], r: [-1.2, 0.06, -0.24], s: 1.0 },
              { p: [0.05, -1.18, -0.35], r: [-1.22, -0.04, 0.16], s: 1.06 },
              { p: [2.0, -1.3, 0.72], r: [-1.18, 0.08, -0.11], s: .98 },
            ];

        if (SLOTS.portrait) {
          /* center the book in the region between the nav and the info sheet */
          const el = document.getElementById("dp");
          const panelH =
            el && el.offsetHeight > 40 ? el.offsetHeight : innerHeight * 0.44;
          const gap = innerHeight * 0.035,
            navB = innerHeight * 0.1;
          const freeTop = navB;
          const freeBot = Math.max(innerHeight - panelH - gap, freeTop + 140);
          const midPx = (freeTop + freeBot) / 2;

            camZp = 9.9,
            zw = 0.8 * fit,
            rootY = -(1 - fit) * 0.55;

          const availW =
            (((freeBot - freeTop) * 0.92) / innerHeight) *
            2 *
            T13 *
            (camZp - zw);
          const s = clamp(availW / fit / 2.3, 0.5, 1.15);
          SLOTS.detail = {
            p: [0, (yw - rootY) / fit, 0.8],
            r: [-0.02, -0.4, 0.06],
            s: s,
          };
        } else {
          SLOTS.detail = {
            p: [-1.95, 0.0, 1.1],
            r: [0.02, -0.28, 0.04],
            s: 1.38,
          };
        }
      }

      function setTargets(b, slot) {
        const s = b.springs;
        s.px.t = slot.p[0];
        s.py.t = slot.p[1];
        s.pz.t = slot.p[2];
        s.rx.t = slot.r[0];
        s.ry.t = slot.r[1];
        s.rz.t = slot.r[2];
        b.slotScale = slot.s;

      /* ---------------------------------------------------------------------
         Exit / return motion.

         A spring aimed far below the frame accelerates the whole way, which
         reads as a fast drop. Instead the vertical axis is handed to a small
         keyframed tween for the duration of the move, so the curve is designed:
         a soft decelerating lift, a beat of hang time, then a long glide down

         --------------------------------------------------------------------- */

      /* advances the tween and writes straight into the y spring, keeping the

        if (seg) s.py.v = seg.from + (seg.to - seg.from) * seg.ease(ex.t / seg.d);

        s.py.t = s.py.v;
        s.py.vel = 0;
      }

      /* x, z and rotation are pinned to wherever the book already stands, so the
         whole move happens on the y axis and nothing slides sideways */
      function pinInPlace(b) {
        const s = b.springs;
        s.px.t = s.px.v;
        s.pz.t = s.pz.v;
        s.rx.t = s.rx.v;
        s.ry.t = s.ry.v;
        s.rz.t = s.rz.v;

      function sendOut(b, i, delay) {
        const y0 = SLOTS.hero[i].p[1],
          here = b.springs.py.v,
          apex = y0 + LIFT;
        b.root.visible = true;
        pinInPlace(b);
        playY(b, [
          { d: delay, from: here, to: here, ease: EASE.hold },
          { d: 0.28, from: here, to: apex, ease: EASE.outQuad },
          {
            d: 0.9,
            from: apex,
            to: y0 - CLEAR,
            ease: EASE.inOutSine,
            end: () => {

      function bringBack(b, i, delay) {

        const homeSlot = (state.collectionMode ? SLOTS.collection : SLOTS.hero)[i];

        pinInPlace(b);
        playY(b, [
          { d: delay, from: here, to: here, ease: EASE.hold },
          { d: 1.0, from: here, to: homeSlot.p[1], ease: EASE.outQuint },
        ]);

      function applyMode() {
        if (state.mode === "hero" || state.mode === "closing") {

        camY = new Spring(0.1, 13, 6.5),
        camZ = new Spring(9.6, 13, 6.5);

        lookY = new Spring(0, 13, 6.5);

        parY = new Spring(0, 60, 10);

          camY.t = 0.1;
          camZ.t = SLOTS.portrait ? 9.9 : 8.9;
          lookX.t = SLOTS.portrait ? 0 : -0.5;
          lookY.t = SLOTS.portrait ? 0 : 0.15;

          camX.t = 0;
          camY.t = SLOTS.portrait ? 3.4 : 4.2;
          camZ.t = SLOTS.portrait ? 8.8 : 8.1;
          lookX.t = 0;
          lookY.t = -1.15;
        } else {
          camX.t = 0;
          camY.t = 0.1;
          camZ.t = 9.6;
          lookX.t = 0;
          lookY.t = 0;
        }
      }

      /* detail panel */
      const dpTitle = document.getElementById("dpTitle");
      const dpDesc = document.getElementById("dpDesc");
      const dpStars = document.getElementById("dpStars");
      const dpYear = document.getElementById("dpYear");
      const STAR =
        '<svg viewBox="0 0 24 24" class="CLS"><path d="M12 2.6l2.8 6 6.6.6-5 4.4 1.5 6.5L12 16.7 6.1 20.1l1.5-6.5-5-4.4 6.6-.6z"/></svg>';
      function populatePanel(cfg) {
        dpTitle.textContent = cfg.title;
        dpDesc.textContent = cfg.desc;
        dpYear.textContent = cfg.year;
        let s = "";
        for (let i = 0; i < 5; i++)
          s += STAR.replace("CLS", i < cfg.stars ? "" : "dim");
        dpStars.innerHTML = s;
      }

      const pill = document.getElementById("openBtn");
      /* the slip trails the cursor with a touch of lag */
      const pillX = new Spring(0, 190, 23),
        pillY = new Spring(0, 190, 23);
      let pillOn = false;
      function hidePill() {
        pill.classList.remove("on");
        pillOn = false;
      }

      function open(book) {
        if (state.mode !== "hero" || !book) return;
        state.mode = "opening";
        state.selected = book;
        state.pillLock = null;
        state.kbIndex = -1;
        hidePill();
        book.exit = null; /* hand y back to the spring if it was still tweening */
        document.body.classList.add("transit");
        tableRoot.visible = false;
        portraitAvatar.visible = false;
        populatePanel(book.cfg);
        computeSlots();

        /* beat one: the other two lift and drop away. the chosen book holds its
           ground here, so nothing crosses paths with them. */
        let out = 0;
        books.forEach((b, i) => {
          if (b !== book) sendOut(b, i, out++ * 0.08); /* slight stagger */
        });

           to the detail slot, and the frame pans with it */

          if (state.mode !== "opening" && state.mode !== "detail") return;
          book.orbY = RM ? 0 : -6.2832;
          book.orbYv = RM ? 0 : 3;
          book.orbPhase = "return";
          book.orbTarget = 0;
          book.orbXs.set(0);
          applyMode();

        setTimeout(() => leaves.activate(book), 1000);
        setTimeout(() => {
          if (state.mode === "opening") {
            document.body.classList.add("detail-open");
            state.mode = "detail";
          }

      }

      function close() {
        if (state.mode !== "detail") return;
        state.mode = "closing";
        document.body.classList.remove("detail-open");
        portraitAvatar.visible = false;
        leaves.deactivate();
        orbit.drag = false;
        const b = state.selected;
        if (b) {
          /* one clean turn on the way home, landing front-on */
          b.orbTarget = Math.round(b.orbY / 6.2832) * 6.2832 + 6.2832;
          b.orbYv = Math.max(b.orbYv, 3);
          b.orbPhase = "return";
          b.orbXs.t = 0;
        }
        setTimeout(() => {
          document.body.classList.remove("transit");
          tableRoot.visible = state.collectionMode;
          applyMode();
          camTo(state.collectionMode ? "collection" : "hero");
          /* and they only climb back once the frame has finished returning */
          let back = 0;
          books.forEach((bk, i) => {
            if (bk !== b) bringBack(bk, i, 0.85 + back++ * 0.1);
          });
        }, 250);
        setTimeout(() => {
          if (state.mode === "closing") {
            state.mode = "hero";
            state.selected = null;
          }
        }, 1600);
      }

      document.getElementById("closeBtn").addEventListener("click", close);
      document.getElementById("collectionBtn").addEventListener("click", (e) => {
        if (state.mode !== "hero") return;
        state.collectionMode = !state.collectionMode;
        e.currentTarget.textContent = state.collectionMode ? "返回展厅" : "我的收藏";
        tableRoot.visible = state.collectionMode;
        document.body.classList.toggle("table-mode", state.collectionMode);
        applyMode();
        camTo(state.collectionMode ? "collection" : "hero");
      });
      document.querySelectorAll("#timeline button").forEach((btn) => {
        btn.addEventListener("click", () => open(books[Number(btn.dataset.album)]));
      });
      window.addEventListener("dblclick", (e) => {
        if (state.mode !== "hero") return;
        for (let i = 0; i < 5; i++) {
          const paw = document.createElement("span");
          paw.className = "paw-print"; paw.textContent = "🐾";
          paw.style.left = e.clientX + (i - 2) * 35 + "px";
          paw.style.top = e.clientY + (i % 2) * 22 + "px";
          paw.style.animationDelay = i * .08 + "s";
          document.body.appendChild(paw); setTimeout(() => paw.remove(), 2300);
        }
      });

      const uploadInput = document.getElementById("photoUpload");
      const toast = document.getElementById("toast");
      function showToast(message) { toast.textContent = message; toast.classList.add("on"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove("on"), 1800); }
      document.getElementById("uploadBtn").addEventListener("click", () => uploadInput.click());
      uploadInput.addEventListener("change", () => {
        const file = uploadInput.files && uploadInput.files[0]; if (!file) return;
        const url = URL.createObjectURL(file);
        new THREE.TextureLoader().load(url, (t) => {
          t.encoding = THREE.sRGBEncoding; t.anisotropy = ANISO;
          const target = state.selected || state.hovered || books[0];
          target.frontMesh.material[4].map = t; target.frontMesh.material[4].needsUpdate = true;
          target.cfg.title = file.name.replace(/\.[^.]+$/, "");
          showToast("照片已自动装入相框");
          URL.revokeObjectURL(url);
        });
      });
      function playMemorySound() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        osc.type = "sine"; osc.frequency.setValueAtTime(392, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(587, ac.currentTime + 1.2);
        gain.gain.setValueAtTime(.0001, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(.08, ac.currentTime + .12);

      document.getElementById("memorySound").addEventListener("click", playMemorySound);
      document.getElementById("exportCard").addEventListener("click", () => {
        if (!state.selected) return;
        const cfg = state.selected.cfg, c = document.createElement("canvas");
        c.width = 1080; c.height = 1440; const x = c.getContext("2d");
        x.fillStyle = "#efe5d1"; x.fillRect(0, 0, c.width, c.height);
        const img = new Image(); img.onload = () => {
          const box = { x: 90, y: 110, w: 900, h: 820 };
          const scale = Math.max(box.w / img.width, box.h / img.height);
          const sw = box.w / scale, sh = box.h / scale;
          x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, box.x, box.y, box.w, box.h);
          x.strokeStyle = "#5b3c25"; x.lineWidth = 26; x.strokeRect(box.x, box.y, box.w, box.h);
          x.fillStyle = "#34251b"; x.font = "700 66px Georgia"; x.fillText(cfg.title, 90, 1050);
          x.font = "36px Georgia"; x.fillStyle = "#765a43"; x.fillText(cfg.author + " · " + cfg.year, 90, 1120);
          x.font = "32px sans-serif"; x.fillStyle = "#4a392d";
          x.fillText(cfg.desc.slice(0, 30), 90, 1210); x.fillText(cfg.desc.slice(30, 60), 90, 1260);
          x.fillStyle = "#9c7448"; x.font = "34px sans-serif"; x.fillText("🐾 MEMORIES", 90, 1360);
          const a = document.createElement("a"); a.download = cfg.title + "-纪念卡.png"; a.href = c.toDataURL("image/png"); a.click();
          showToast("纪念卡已生成并保存");
        };
        img.src = cfg.coverURL;
      });
      /* the slip is never a hit target — clicking the book under it opens it,
         which is also what keeps it able to follow the cursor */

      /* =========================================================================
   7. Input: pointer as hand, drag to peel, keyboard
   ========================================================================= */
      const ptr = {
        ndcX: 0,
        ndcY: 0,
        cx: innerWidth / 2,
        cy: innerHeight / 2,
        lastX: 0,
        lastY: 0,
        down: false,
        downX: 0,
        downY: 0,
        moved: 0,
        t0: 0,
        type: "mouse",
        seen: false,
        id: null, /* only the first finger down drives the scene */
      };
      const isTouch = () => ptr.type === "touch" || ptr.type === "pen";
      let dragBook = null,
        rayBook = null;
      const orbit = { drag: false, dxAcc: 0, dyAcc: 0 };
      const ray = new THREE.Raycaster();
      const tmpV = new THREE.Vector3();

      const canvas = renderer.domElement;
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      /* pointer off the canvas: nothing is hovered, so the slip goes away */
      canvas.addEventListener("pointerleave", () => {
        rayBook = null;
        state.pillLock = null;
        state.kbIndex = -1;
      });

      canvas.addEventListener("pointermove", (e) => {
        if (ptr.id !== null && e.pointerId !== ptr.id) return;
        const dxN = (e.clientX - ptr.lastX) / innerWidth;
        const dyN = (e.clientY - ptr.lastY) / innerHeight;
        ptr.lastX = e.clientX;
        ptr.lastY = e.clientY;
        ptr.cx = e.clientX;
        ptr.cy = e.clientY;
        ptr.ndcX = (e.clientX / innerWidth) * 2 - 1;
        ptr.ndcY = -(e.clientY / innerHeight) * 2 + 1;
        ptr.type = e.pointerType || "mouse";
        ptr.seen = true;
        if (state.mode === "detail") leaves.push(dxN, dyN);
        if (ptr.down && dragBook) {
          ptr.moved += Math.abs(dxN * innerWidth) + Math.abs(dyN * innerHeight);
          if (state.collectionMode) {
            dragBook.springs.px.t = clamp(dragBook.springs.px.t + dxN * 9, -3.4, 3.4);
            dragBook.springs.pz.t = clamp(dragBook.springs.pz.t + dyN * 7, -1.7, 1.8);
            dragBook.springs.py.t = -1.05;
            dragBook.springs.rz.t += dxN * .9;
            dragBook.tableVX = dxN * 28;
            dragBook.tableVZ = dyN * 22;
          } else {
            dragBook.springs.drag.t = clamp(
              ((ptr.downX - e.clientX) / innerWidth) * 3.4,
              0,
              1.0,
            );
          }

          orbit.dyAcc += dyN;

        if (ptr.id !== null) return; /* a second finger must not hijack the drag */

        ptr.cx = e.clientX;
        ptr.cy = e.clientY;
        /* seed the move baseline: without this, a touch's first pointermove
           measures from wherever the pointer was last seen and the resulting
           jump is mistaken for a drag, so taps never open a book */
        ptr.lastX = e.clientX;
        ptr.lastY = e.clientY;
        ptr.ndcX = (e.clientX / innerWidth) * 2 - 1;
        ptr.ndcY = -(e.clientY / innerHeight) * 2 + 1;
        ptr.type = e.pointerType || "mouse";
        ptr.seen = true;
        castRay();
        if (state.mode === "hero" && rayBook) {
          ptr.down = true;
          dragBook = rayBook;
          ptr.downX = e.clientX;
          ptr.downY = e.clientY;
          ptr.moved = 0;
          ptr.t0 = performance.now();
          if (state.collectionMode) {
            rayBook.springs.py.t = -1.05;
            rayBook.tableVX = rayBook.tableVZ = 0;
          }
          canvas.setPointerCapture(e.pointerId);
        } else if (state.mode === "detail" && rayBook === state.selected) {
          ptr.down = true;
          orbit.drag = true;
          orbit.dxAcc = 0;
          orbit.dyAcc = 0;
          ptr.moved = 0;
          ptr.t0 = performance.now();
          canvas.setPointerCapture(e.pointerId);
        } else {
          state.pillLock = null;
          state.kbIndex = -1;
        }
      });

      window.addEventListener("pointerup", (e) => {
        if (ptr.id !== null && e.pointerId !== ptr.id) return;
        ptr.id = null;
        orbit.drag = false;
        if (dragBook) {
